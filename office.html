<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클로드 오피스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#e7e9f4; --card:#ffffff; --ink:#262a3f; --sub:#767b95; --faint:#a7abc0; --line:#e4e6f0;
  --indigo:#3d4291; --indigo-soft:#eceefb; --lit:#ffc94d; --claude:#e2733f; --live:#2f9e66;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:13px}
button{font:inherit;color:inherit}
.jua{font-family:"Jua","IBM Plex Sans KR",sans-serif;font-weight:400}
#app{display:grid;grid-template-columns:220px 1fr 290px;gap:14px;height:100vh;padding:14px}

/* ── 왼쪽: 건물 단면 ── */
#rail{display:flex;flex-direction:column;min-height:0}
#roof{position:relative;height:58px;flex:none}
#roof svg{position:absolute;inset:0;width:100%;height:100%}
#roof .rn{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:14px;color:#fff;letter-spacing:.5px;white-space:nowrap}
#stack{flex:0 1 auto;min-height:0;overflow:auto;background:#d5d9ea;padding:8px 8px 20px;display:flex;flex-direction:column;gap:6px;
  border-left:6px solid #c4c9de;border-right:6px solid #c4c9de}
.fl{position:relative;background:var(--card);border-radius:10px;padding:9px 30px 9px 10px;display:grid;grid-template-columns:38px 1fr;gap:2px 8px;cursor:pointer;
  box-shadow:0 2px 0 #c0c5da}
.fl:hover{background:#fbfbfe}
.fl:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.fl .no{grid-row:1/3;font-size:22px;line-height:1;color:var(--indigo);align-self:center}
.fl b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .sub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .win{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.fl .win button{width:13px;height:11px;border:0;border-radius:2px;background:#cfd3e2;padding:0;cursor:pointer}
.fl .win button.warm{background:#ffe7a8}
.fl .win button.lit{background:var(--lit);box-shadow:0 0 6px rgba(255,190,60,.8)}
.fl .win button.cx{border-radius:6px 6px 2px 2px;box-shadow:inset 0 -3px 0 #14a085}
.fl .win button.lit.cx{box-shadow:inset 0 -3px 0 #14a085,0 0 6px rgba(255,190,60,.8)}
.fl .win button.cur{outline:2px solid var(--claude);outline-offset:1px}
.fl .win button:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.fl.cur{background:var(--indigo);color:#fff;box-shadow:0 2px 0 #262a66}
.fl.cur .no{color:#fff}
.fl.cur .sub{color:#c9ccf0}
.fl.cur .win button{background:#5a5fa8}
.fl.cur .win button.warm{background:#c8b47a}
.fl.cur .win button.lit{background:var(--lit)}
.fl .car{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:14px;height:22px;border-radius:3px;background:#ffb347;display:none}
.fl .car::before,.fl .car::after{content:"";position:absolute;left:6px;width:2px;height:40px;background:#9aa0c4}
.fl .car::before{bottom:100%}.fl .car::after{top:100%}
.fl.cur .car{display:block}
.fl.dim b,.fl.dim .no{opacity:.55}
.fl .x{position:absolute;right:4px;top:4px;width:22px;height:20px;border:0;border-radius:6px;background:none;color:var(--sub);font-size:14px;line-height:1;cursor:pointer;padding:0;opacity:0}
.fl:hover .x,.fl:focus-within .x{opacity:1}
.fl .x:hover{background:#e6e8f3;color:var(--ink)}
.fl.cur .x{color:#c9ccf0}.fl.cur .x:hover{background:#5a5fa8;color:#fff}
@media (hover:none){.fl .x{opacity:1}}
#ground{flex:none;height:34px;background:linear-gradient(#8fcf7a 0 8px,#b98e64 8px);border-radius:0 0 12px 12px;position:relative}
/* 1층 — 로비 */
.fl.lobby{background:#fff8e6;box-shadow:0 2px 0 #e6d3a8;padding-right:10px}
.fl.lobby .no{color:#d38f22}
.fl.lobby .door{grid-column:2;display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:#9a6a1c}
.fl.lobby .door i{width:22px;height:12px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#9fd3f0 0 48%,#7ab8de 48% 52%,#9fd3f0 52%);box-shadow:inset 0 0 0 1.5px #d38f22;flex:none}
.fl.lobby.on{background:#ffe9b0;box-shadow:0 2px 0 #d9b25c}
.fl.lobby.cur{background:#d38f22;box-shadow:0 2px 0 #a86c12;color:#fff}
.fl.lobby.cur .no,.fl.lobby.cur .sub,.fl.lobby.cur .door{color:#fff}
/* 로비 안내판 */
#lobbyV{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:70px 20px 20px;background:rgba(255,248,230,.55);backdrop-filter:blur(3px)}
#lobbyV.open{display:flex}
#board{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:#3a2f28;border-radius:18px;border:6px solid #c58449;box-shadow:0 14px 40px rgba(60,40,20,.3);color:#fff5e0;overflow:hidden}
#board header{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:2px dashed rgba(255,230,190,.25)}
#board h3{margin:0;font-size:20px;font-weight:400;flex:1}
#board header label{display:flex;align-items:center;gap:6px;font-size:12px;color:#e8d4b0;cursor:pointer}
#board header label input{accent-color:#ffb347;margin:0}
#board .list{overflow:auto;padding:6px 10px 10px}
#board .rw{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
#board .rw:hover,#board .rw:focus-visible{background:rgba(255,230,190,.1);outline:none}
#board .rw .no{grid-row:1/3;font-size:22px;color:#ffb347;text-align:center}
#board .rw b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#board .rw .st{font-size:11px;color:#c9b08a;white-space:nowrap}
#board .rw .st.on{color:#8fe3ab}
#board .rw .what{grid-column:2/4;font-size:11.5px;color:#e8d4b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
#board .rw .who{font-size:10px;font-weight:700;color:#c8642f;background:#fdf0e8;border-radius:5px;padding:1px 5px;flex:none}
#board .rw .who.cx{color:#0e7c66;background:#e2f6f1}
#board .rw.idle b,#board .rw.idle .no{opacity:.55}
#board .tabs{display:flex;gap:4px;background:rgba(255,230,190,.08);border-radius:9px;padding:3px}
#board .tabs button{border:0;background:none;color:#e8d4b0;font:inherit;font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer}
#board .tabs button.on{background:#ffb347;color:#3a2f28;font-weight:700}
#board .sum{margin:6px 8px 8px;font-size:12.5px;color:#e8d4b0}
#board .sum b{color:#ffb347}
#board .day{position:relative;flex:none;width:96px;height:6px;margin-left:auto;background:rgba(255,230,190,.12);border-radius:3px;overflow:hidden}
#board .day i{position:absolute;top:0;bottom:0;width:max(1px,.35%);background:#8fe3ab}
#board .frame{display:flex;align-items:center;gap:14px;margin:8px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#fff3c4,#ffd36b);border:4px solid #c58449;box-shadow:inset 0 0 0 2px #fff8de;color:#4a2a00}
#board .frame img{width:64px;height:64px;border-radius:12px;background:#fff8e6;flex:none}
#board .frame span{display:block;font-size:12px;font-weight:700;color:#a86c12}
#board .frame b{display:block;font-size:24px;font-weight:400;line-height:1.2}
#board .frame em{font-style:normal;font-size:12px;color:#7a4e10}
#board .rep-top{margin:6px 8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
#board .rep-top>b{font-size:16px;font-weight:400;flex:1}
#board .rep-top span{width:100%;font-size:12px;color:#e8d4b0}#board .rep-top span b{color:#ffb347}
#board .copy{border:0;background:#ffb347;color:#3a2f28;font:inherit;font-size:11.5px;font-weight:700;border-radius:7px;padding:4px 10px;cursor:pointer}
#board .rep{margin:0 4px 8px;padding:10px;border-radius:10px;background:rgba(255,230,190,.06);cursor:pointer}
#board .rep:hover{background:rgba(255,230,190,.12)}
#board .rep .rh{display:flex;align-items:center;gap:8px}
#board .rep .rh .no{font-size:18px;color:#ffb347;width:34px;text-align:center}
#board .rep .rh b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#board .rep .rh .st{font-size:11.5px;color:#8fe3ab;white-space:nowrap}
#board .rep .tl{margin:6px 0 0 42px;font-size:11px;color:#c9b08a;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#board .rep .tl i{font-style:normal;background:rgba(255,230,190,.1);border-radius:6px;padding:1px 6px;color:#e8d4b0}
#board .rep .tl i.e{background:rgba(255,107,91,.2);color:#ffb0a6}
#board .rep ul{margin:6px 0 0 42px;padding-left:14px;font-size:12px;color:#fff5e0;line-height:1.5}
#board .rep .files{margin:6px 0 0 42px;display:flex;flex-wrap:wrap;gap:4px;font-size:10.5px;color:#c9b08a}
#board .rep .files i{font-style:normal;font-family:ui-monospace,Menlo,monospace;background:rgba(143,227,171,.12);color:#bfeccc;border-radius:5px;padding:1px 5px}
#board .gap{height:1px;background:rgba(255,230,190,.2);margin:6px 8px}
/* 층 알림 — 질문(주황) · 에러(빨강) 이 오면 그 층 카드가 깜빡임 */
.fl.ask{animation:flAsk 1s ease-in-out infinite}
.fl.err{animation:flErr 1s ease-in-out infinite}
@keyframes flAsk{50%{box-shadow:0 0 0 3px #ffb347,0 0 14px #ffb347}}
@keyframes flErr{50%{box-shadow:0 0 0 3px #ff6b5b,0 0 14px #ff6b5b}}
.fl .tag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:4px;background:#ffb347;color:#4a2a00}
.fl.err .tag{background:#ff6b5b;color:#fff}
@media (prefers-reduced-motion:reduce){.fl.ask,.fl.err{animation:none;box-shadow:0 0 0 3px #ffb347}}
/* 대표실 */
.fl.ceo{background:#2f2a4a;color:#fff;box-shadow:0 2px 0 #1d1930;padding-right:10px}
.fl.ceo .no{color:#ffd34d;font-size:15px}
.fl.ceo .sub{color:#c9c3e8}
.fl.ceo.cur{outline:2px solid #ffd34d;outline-offset:1px}
/* 옥상정원 */
.fl.rf{background:linear-gradient(135deg,#e6f7dc,#c9ecb8);box-shadow:0 2px 0 #8fc47a;padding-right:10px}
.fl.rf .no{color:#2f9e66}.fl.rf b{color:#2f6b45}.fl.rf .sub{color:#4d7d5c}
.fl.rf.cur{background:#2f9e66;box-shadow:0 2px 0 #1e7048}.fl.rf.cur .no,.fl.rf.cur b,.fl.rf.cur .sub{color:#fff}
/* 지하 — 관리실 */
#base{flex:none;display:none;background:linear-gradient(#b98e64,#8a6444);padding:2px 8px 10px;border-radius:0 0 12px 12px;
  background-image:radial-gradient(circle at 18% 30%,rgba(255,255,255,.12) 0 3px,transparent 4px),radial-gradient(circle at 78% 70%,rgba(0,0,0,.1) 0 4px,transparent 5px),linear-gradient(#b98e64,#8a6444)}
#rail.hasBase #ground{border-radius:0}
#rail.hasBase #base{display:block;overflow:hidden}
#base .fl{background:#fff6ea;box-shadow:0 2px 0 #6e4f35}
#base .fl .no{color:#8a6444}
#base .fl.cur{background:#6e4f35;box-shadow:0 2px 0 #4a3423}
#base .fl.cur .no{color:#fff}
#ground::before{content:"";position:absolute;left:50%;top:-14px;width:46px;height:14px;margin-left:-23px;background:#9aa0c4;border-radius:6px 6px 0 0}
#unhide{flex:none;margin-top:8px;border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:6px}
#unhide:hover{color:var(--ink)}
/* ── 층 정리 창 ── */
/* 처음 설정 창 */
#setupBg{position:fixed;inset:0;background:rgba(38,42,63,.38);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#setupBg.open{display:flex}
#setup{background:var(--card);border-radius:20px;box-shadow:0 18px 50px rgba(40,40,90,.3);width:min(460px,100%);max-height:100%;overflow:auto;padding:22px 22px 18px}
#setup h3{margin:0 0 4px;font-size:22px;font-weight:400;color:var(--indigo)}
#setup .lead{margin:0 0 14px;color:var(--sub);font-size:12.5px;line-height:1.6}
#setup label.f{display:block;margin:12px 0 0;font-size:12.5px;font-weight:600}
#setup label.f small{display:block;font-weight:400;color:var(--sub);margin:2px 0 6px}
#setup input[type=text]{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);background:#fff}
#setup input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:-1px}
#setup .ck{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:12.5px;cursor:pointer}
#setup .ck input{margin-top:3px}
#setup .ck small{display:block;color:var(--sub)}
#setup .found{margin:14px 0 0;padding:10px 12px;background:#f6f7fc;border-radius:10px;font-size:12px;line-height:1.7;color:#4b5068}
#setup .note{font-size:12px;color:var(--sub);margin:12px 0 0;line-height:1.6}
#setup .msg{color:#d4483b;font-size:12px;min-height:16px;margin:10px 0 0}
#setup footer{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#setup .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
#setup .btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
#tidyBg{position:fixed;inset:0;background:rgba(38,42,63,.32);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#tidyBg.open{display:flex}
#tidy{background:var(--card);border-radius:18px;box-shadow:0 18px 50px rgba(40,40,90,.28);width:min(520px,100%);max-height:min(640px,100%);display:flex;flex-direction:column;overflow:hidden}
#tidy header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
#tidy header .no{font-size:24px;color:var(--indigo)}
#tidy header h3{margin:0;font-size:18px;font-weight:400;flex:1}
#tidy header button{border:0;background:none;font-size:20px;color:var(--sub);cursor:pointer;width:30px;height:30px;border-radius:8px}
#tidy header button:hover{background:#f0f1f7;color:var(--ink)}
#tidy .bd{overflow:auto;padding:0 18px 12px}
#tidy .row{display:flex;align-items:center;gap:8px;margin:10px 0}
#tidy .lab{font-size:12px;color:var(--sub);width:64px;flex:none}
#tidy .path{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#4b5068;word-break:break-all}
#tidy input,#tidy select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
#tidy input{flex:1}
#tidy input:focus,#tidy select:focus{outline:2px solid var(--indigo);outline-offset:-1px}
#tidy h4{margin:16px 0 6px;font-size:12px;color:var(--sub);font-weight:600}
#tidy .sl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
#tidy .sl .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tidy .sl .w{color:var(--faint);font-size:11px;flex:none}
#tidy .sl select{width:130px;flex:none}
#tidy .who{font-size:10px;font-weight:700;color:#c8642f;background:#fdf0e8;border-radius:5px;padding:1px 5px;flex:none}
#tidy .who.cx{color:#0e7c66;background:#e2f6f1}
#tidy .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
#tidy .btn:hover{border-color:#cdd0e0;background:#fafbfe}
#tidy .btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
#tidy .chip{display:inline-flex;align-items:center;gap:6px;background:var(--indigo-soft);border-radius:8px;padding:4px 4px 4px 9px;font-size:12px;margin:0 6px 6px 0}
#tidy .chip button{border:0;background:#fff;border-radius:6px;font-size:11px;padding:3px 7px;cursor:pointer;color:var(--sub)}
#tidy .chip button:hover{color:var(--ink)}
#tidy .note{font-size:11.5px;color:var(--sub);margin:4px 0}
#tidy footer{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfe}
#tidy footer .sp{flex:1}
#tidy footer .lnk{border:0;background:none;color:var(--sub);font-size:11.5px;cursor:pointer;padding:4px;text-decoration:underline}

/* ── 가운데: 디오라마 ── */
#center{position:relative;overflow:hidden;border-radius:22px;
  background:
    radial-gradient(120px 40px at 18% 18%,rgba(255,255,255,.85),transparent 70%),
    radial-gradient(160px 46px at 78% 12%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(130px 36px at 88% 64%,rgba(255,255,255,.6),transparent 70%),
    linear-gradient(180deg,#c8dcff 0%,#e3e2fb 52%,#fbe3d8 100%)}
/* 밤 모드 — 남색 하늘 · 별 · 달 */
#center.night{background:
    radial-gradient(28px 28px at 84% 14%,#fff6d8 0 45%,rgba(255,240,190,.35) 55%,transparent 72%),
    radial-gradient(1.5px 1.5px at 12% 20%,#fff 99%,transparent),radial-gradient(1px 1px at 22% 8%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 35% 15%,#fff 99%,transparent),radial-gradient(1px 1px at 48% 6%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 60% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 70% 9%,#fff 99%,transparent),
    radial-gradient(1px 1px at 93% 30%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 6% 42%,#fff 99%,transparent),
    radial-gradient(1px 1px at 95% 52%,#fff 99%,transparent),radial-gradient(1px 1px at 4% 70%,#fff 99%,transparent),
    linear-gradient(180deg,#1b1f4a 0%,#2c2f6b 55%,#4a3f78 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#head{position:absolute;left:16px;top:16px;right:16px;display:flex;align-items:flex-start;gap:10px;pointer-events:none}
#title{pointer-events:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:9px 12px 9px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 20px rgba(60,60,110,.10);max-width:min(520px,70%)}
#title .fno{font-size:26px;color:var(--indigo);line-height:1}
#title .tx{min-width:0}
#title .tx b{display:block;font-size:15px;font-weight:700}
#title .tx span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sessBtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;flex:none}
#sessBtn:hover{border-color:#cdd0e0}
#sessBtn:focus-visible{outline:2px solid var(--indigo)}
#pop{position:absolute;left:16px;top:76px;width:330px;max-height:60%;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 34px rgba(50,50,100,.18);padding:8px;display:none;z-index:5}
#pop.open{display:block}
#pop label{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);margin-bottom:4px;cursor:pointer}
#pop label input{accent-color:var(--indigo);margin:0}
.ss{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12px}
.ss:hover{background:#f5f6fb}
.ss .who{font-size:10px;font-weight:700;color:#c8642f;background:#fdf0e8;border-radius:5px;padding:1px 5px;flex:none}
.ss .who.cx{color:#0e7c66;background:#e2f6f1}
.ss .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss .w{font-size:11px;color:var(--faint)}
.ss .now{font-size:10.5px;color:var(--live);font-weight:600}
.ss.cur{background:var(--indigo-soft);font-weight:600}

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const HOME = { claude: { spot: [13.35, 3.75], report: [12.05, 3.75] }, codex: { spot: [9.8, 2.95], report: [11.1, 2.95] }, agy: { spot: [12.0, 2.7], report: [11.2, 3.6] } };
const BRAND = { claude: 'Claude', codex: 'Codex', agy: 'Antigravity' };

const whoCls = (s) => ({ codex: 'cx', agy: 'ag' })[kindOf(s)] || '';
// 층마다 붙인 직원 이름 (층 정리 창에서 정함). 없으면 Claude / Codex
const curProj = () => { const f = SNAP && SNAP.floors.find(x => x.n === curFloorN); return f ? f.proj : ''; };
const staff = (kind, proj = curProj()) => ((layout.workers[proj] || {})[kind]) || BRAND[kind];
const nameActor = (W) => { const n = staff(W.kind); W.actor.setName(n, n !== BRAND[W.kind] ? BRAND[W.kind] : ''); };
const AG_OFF = [0, 1.1, -1.1, 2.1, -2.1, .55];
const PEOPLE = {
  claude: { body: '#e2733f', hair: '#5b3a26', label: 'Claude', dot: '#e2733f', mark: '✳', ahoge: true },
  Explore: { body: '#3fa46a', hair: '#4a3426', hat: '#2f8655', label: 'Explore', dot: '#3fa46a' },

  'general-purpose': { body: '#4a7fe0', hair: '#7a5230', label: '일반', dot: '#4a7fe0' },
  codex: { body: '#2e3646', hair: '#2a211c', label: 'Codex', dot: '#14a085', headset: '#14a085', mark: '◇' },
  agy: { body: '#7b5cf0', hair: '#2b2350', label: 'Antigravity', dot: '#7b5cf0', mark: '▲', float: true, halo: '#b9a6ff' },
  Guardian: { body: '#d9a930', hair: '#4a3426', cap: '#2e3646', label: '검토 요원', dot: '#d9a930' },
  Helper: { body: '#5fc4ae', hair: '#5a3a26', label: 'Codex 도우미', dot: '#5fc4ae' },
  me: { body: '#e86a8a', hair: '#3b2418', dot: '#d38f22', long: true, lady: true, pin: '#ffd34d', skirt: '#2f2a4a' }, // 대표: 긴 머리 · 핑크 재킷 · 머리핀
  barista: { body: '#6b4a33', hair: '#2a1d17', dot: '#c58449', apron: '#f3e4cf', cap: '#3a2a20' }, // 로비 카페 바리스타

  other: { body: '#7d8899', hair: '#3a3128', dot: '#7d8899' },
};
const pkey = (t) => PEOPLE[t] ? t : 'other';
const plabel = (t) => (PEOPLE[t] && PEOPLE[t].label) || t;

// ───────── 캔버스 · 카메라 ─────────
const cv = $('#cv'), center = $('#center'), ov = $('#ov');
let ctx = cv.getContext('2d');
let dpr = 1, CW = 0, CH = 0;
const cam = { x: 0, y: 0, z: 1 };
const P = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z];
const toScreen = (x, y, z = 0) => { const p = P(x, y, z); return [p[0] * cam.z + cam.x, p[1] * cam.z + cam.y]; };
function resize() {
  dpr = window.devicePixelRatio || 1; CW = center.clientWidth; CH = center.clientHeight;
  cv.width = CW * dpr; cv.height = CH * dpr;
  if (!resize.done && CW > 0) { fitView(); resize.done = true; }
}
let view = 'office'; // 'office' = 층 사무실, 'ceo' = 대표실, 'lobby' = 1층 로비
const CEO = { w: 12, h: 10 }, LOBBY = { w: 14, h: 11 }, ROOF = { w: 13, h: 10 };
const curWorld = () => view === 'ceo' ? CEO : view === 'lobby' ? LOBBY : view === 'roof' ? ROOF : WORLD;
function fitView() {
  const Wd = curWorld();
  const c = [P(-ISLE, Wd.h + ISLE), P(Wd.w + ISLE, -ISLE), P(-ISLE, -ISLE, WALL), P(Wd.w + ISLE, Wd.h + ISLE, -SOIL)];
  const minX = c[0][0], maxX = c[1][0], minY = c[2][1], maxY = c[3][1];
  const top = 78, bot = 96;
  cam.z = Math.min((CW - 30) / (maxX - minX), (CH - top - bot) / (maxY - minY));
  cam.x = CW / 2 - (minX + maxX) / 2 * cam.z;
  cam.y = top + (CH - top - bot) / 2 - (minY + maxY) / 2 * cam.z;
}
function zoomAt(f, sx, sy) { const nz = Math.max(.35, Math.min(3, cam.z * f)); f = nz / cam.z; cam.x = sx - (sx - cam.x) * f; cam.y = sy - (sy - cam.y) * f; cam.z = nz; }
new ResizeObserver(resize).observe(center);
{
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); closePop(); });
  cv.addEventListener('pointermove', e => { if (drag) { cam.x = drag.cx + e.clientX - drag.x; cam.y = drag.cy + e.clientY - drag.y; } });
  const up = () => { drag = null; cv.classList.remove('drag'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  cv.addEventListener('dblclick', fitView);
  $('#zin').onclick = () => zoomAt(1.2, CW / 2, CH / 2);
  $('#zout').onclick = () => zoomAt(1 / 1.2, CW / 2, CH / 2);
  $('#zfit').onclick = fitView;
}

// ───────── 그리기 도구 ─────────
let EDGE = null;
function hex(c) { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function shade(c, k) { if (c[0] !== '#') return c; const [r, g, b] = hex(c); const f = (v) => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function poly(pts, fill, stroke, lw = 1) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
const faceY = (y, x0, x1, z0, z1, c) => poly([P(x0, y, z0), P(x1, y, z0), P(x1, y, z1), P(x0, y, z1)], c, EDGE, .8);
const faceX = (x, y0, y1, z0, z1, c) => poly([P(x, y0, z0), P(x, y1, z0), P(x, y1, z1), P(x, y0, z1)], c, EDGE, .8);
const faceZ = (x0, y0, x1, y1, z, c) => poly([P(x0, y0, z), P(x1, y0, z), P(x1, y1, z), P(x0, y1, z)], c, EDGE, .8);
function box(x, y, w, d, h, c, z0 = 0) {
  const e = EDGE; EDGE = 'rgba(55,45,70,.28)';
  faceY(y + d, x, x + w, z0, z0 + h, shade(c, -.08));
  faceX(x + w, y, y + d, z0, z0 + h, shade(c, -.2));
  faceZ(x, y, x + w, y + d, z0 + h, c);
  EDGE = e;
}
function ellipse(x, y, rx, ry, c) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function circle(x, y, r, c, s) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); if (s) { ctx.strokeStyle = s; ctx.lineWidth = 1; ctx.stroke(); } }
function rrect(x, y, w, h, r, c, s) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); if (s) { ctx.strokeStyle = s; ctx.lineWidth = 1; ctx.stroke(); } }
// 벽·물건 앞면에 붙은 글씨 — 면의 기울기에 맞춰 비스듬히 씀
// on: 'y' = 뒤쪽 오른벽처럼 x 방향으로 뻗은 면(오른쪽 아래로 기움) / 'x' = 왼벽처럼 y 방향으로 뻗은 면(오른쪽 위로 기움)

// 하루 요약 리포트 — 서버가 보내는 세션별 '오늘 한 일'(day)과 출퇴근 칸(work)을 층별로 합침. AI 없이 기록만
const TOOL_LAB = [['library', '📚 읽기·검색'], ['dev', '🛠 수정'], ['server', '🖥 명령'], ['web', '🌐 웹'], ['meeting', '📋 계획'], ['phone', '📞 에이전트'], ['boss', '🙋 질문']];
function dayData() {
  return (SNAP ? SNAP.floors : []).map(f => {
    const ss = f.sessions.filter(s => s.day || (s.work || []).length); if (!ss.length) return null;
    const tools = {}, files = new Set(), prompts = []; let errors = 0;
    for (const s of ss) if (s.day) { for (const [k, n] of Object.entries(s.day.tools)) tools[k] = (tools[k] || 0) + n; s.day.files.forEach(x => files.add(x)); prompts.push(...s.day.prompts); errors += s.day.errors; }
    const b = [...new Set(ss.flatMap(s => s.work || []))].sort((x, y) => x - y);
    return { f, tools, files: [...files], prompts, errors, mins: b.length * 5, from: b[0], to: b[b.length - 1], who: [...new Set(ss.map(s => staff(kindOf(s), f.proj)))] };
  }).filter(Boolean).sort((a, b) => b.mins - a.mins);
}
const todayTxt = () => new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

  const D = dayData();

    <span>근무 <b>${dur(sum('mins'))}</b> · 일한 층 <b>${D.length}</b> · 시킨 일 <b>${sum(x => x.prompts.length)}</b> · 고친 파일 <b>${sum(x => x.files.length)}</b>${sum('errors') ? ` · ⚠ 에러 <b>${sum('errors')}</b>` : ''}</span></div>`;
  return head + D.map(x => `<div class="rep" data-n="${x.f.n}">
    <div class="rh"><span class="no jua">${fno(x.f.n)}</span><b>${esc(x.f.name)}</b><span class="st">${dur(x.mins)}${x.mins ? ` · ${hm(x.from)}~${hm(x.to + 1)}` : ''}</span></div>
    <div class="tl">${esc(x.who.join(' · '))} ${TOOL_LAB.filter(([k]) => x.tools[k]).map(([k, l]) => `<i>${l} ${x.tools[k]}</i>`).join('')}${x.errors ? `<i class="e">⚠ 에러 ${x.errors}</i>` : ''}</div>
    ${x.prompts.length ? `<ul>${x.prompts.slice(-5).map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}

// 이달의 직원 — 서버가 보내는 세션별 '이번 달 일한 분'(month)을 층 · Claude/Codex 별로 합쳐서 순위
function monthRank() {
  const m = new Map();
  for (const f of SNAP ? SNAP.floors : []) for (const s of f.sessions) {
    if (!s.month) continue;
    const kind = kindOf(s), k = f.proj + '|' + kind;
    const r = m.get(k) || m.set(k, { f, kind, min: 0 }).get(k); r.min += s.month;
  }

}

  const r = monthRank(), mon = new Date().getMonth() + 1;

  const [top, ...rest] = r;
  return `<div class="frame"><img src="${avatar(top.kind)}" alt=""><div><span>🏆 ${mon}월의 직원</span><b class="jua">${esc(staff(top.kind, top.f.proj))}</b>
      <em>${fno(top.f.n)} ${esc(top.f.name)} · ${BRAND[top.kind]} · ${dur(top.min)}</em></div></div>
    ${rest.slice(0, 4).map((x, i) => `<div class="rw" data-n="${x.f.n}" tabindex="0"><span class="no jua">${i + 2}위</span><b>${esc(staff(x.kind, x.f.proj))} · ${esc(x.f.name)}</b><span class="st">${dur(x.min)}</span></div>`).join('')}
    <p class="sum" style="font-size:11px">이번 달 기록에 남은 시각을 5분 단위로 센 근무 시간이에요. 1일이 되면 새로 시작해요.</p>`;

// 출퇴근 기록부 — 서버가 보내는 세션별 '오늘 일한 5분 칸'(work)을 층별로 합쳐서 보여줌
let lobbyTab = 'dir';
const hm = (b) => `${String(Math.floor(b * 5 / 60)).padStart(2, '0')}:${String(b * 5 % 60).padStart(2, '0')}`;

function workBook(floors) {
  const nowB = Math.floor((new Date().getHours() * 60 + new Date().getMinutes()) / 5);

    const all = new Set(f.sessions.flatMap(s => s.work || [])); if (!all.size) { off++; return ''; }

  }).join('');
  return rows ? `<p class="sum">오늘 총 근무 <b>${dur(total)}</b>${off ? ` · 오늘 쉰 층 ${off}개` : ''}</p>${rows}`

// 자동 따라가기가 켜져 있으면 대표님도 지금 보는 층으로 따라감 (이미 와 있으면 그대로)
function followMe() { if (follow && view === 'office' && scene && !scene.me) visit('office'); }
function setFollow(v) { follow = v; if (v) onSnap(); else renderDir(); }

let switching = false;
async function switchTo(key) {
  const s = allSessions().find(x => x.key === key); if (!s) return;
  if (scene && scene.workers.has(key)) { // 같은 사무실 안에서 주인공만 바꿈 (다시 그리지 않음)
    curKey = key; curFloorN = s.floor.n; scene.primary = key; renderDir(); syncCompanion(); return;
  }
  const prevN = curFloorN; curKey = key; curFloorN = s.floor.n;
  renderDir();
  if (prevN !== null && prevN !== s.floor.n) { switching = true; center.classList.add('fade'); await sleep(220); center.classList.remove('fade'); switching = false; }
  buildScene(allSessions().find(x => x.key === curKey) || s);
}
function onSnap() {
  const all = allSessions(), now = Date.now();
  const cur = all.find(s => s.key === curKey);
  let target = curKey;
  if (follow) {
    const best = all.filter(s => s.state).sort((a, b) => b.mtime - a.mtime)[0];
    if (best && (!cur || (best.key !== curKey && now - cur.mtime > 20e3))) target = best.key;
  } else if (cur) {
    const newest = cur.floor.sessions[0];
    if (newest.key !== curKey && newest.mtime > cur.mtime && newest.active && now - cur.mtime > 10e3) target = newest.key;
  }
  if (!target || !all.some(s => s.key === target)) target = all.length ? all.sort((a, b) => b.mtime - a.mtime)[0].key : null;
  if (target && target !== curKey && !switching) switchTo(target).then(followMe); else { renderDir(); syncCompanion(); followMe(); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  const actors = allActors();
  actors.forEach(a => a.update(dt));
  busy = new Set(actors.filter(a => a !== (scene && scene.me)).map(a => zoneAt(a.x, a.y)).filter(Boolean));
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);

function renderUsage(u) {

  };

// ───────── 날씨 ─────────
// 오래 고민하면 섬 위에 구름이 몰려오고, 에러가 나면 비, 일을 마치면 해(밤엔 무지개 대신 반짝임)
const weather = { cloud: 0, target: 0, rainUntil: 0, sunUntil: 0, thinkSince: 0 };
function weatherOn(e) {
  const now = performance.now();
  if (e.k === 'think') { if (!weather.thinkSince) weather.thinkSince = now; weather.target = Math.min(1, weather.target + .25); }
  else if (/^(tool|say)$/.test(e.k)) weather.thinkSince = 0;
  if (e.k === 'error' || e.k === 'agentErr') { weather.rainUntil = now + 5000; weather.target = Math.max(weather.target, .85); }
  if (e.k === 'wait' || e.k === 'agentDone') { weather.sunUntil = now + 7000; weather.target = 0; weather.rainUntil = 0; }
}
const CLOUDS = [[4, 3, 1.6], [11, 1, 1.3], [18, 4, 1.7], [5, 10, 1.4], [13, 9, 1.5], [19, 13, 1.3]];
function cloudShape(x, y, s, c) {
  for (const [dx, dy, r] of [[-26, 4, 18], [-8, -6, 24], [14, -2, 20], [30, 6, 14], [0, 8, 20]]) ellipse(x + dx * s, y + dy * s, r * s * 1.15, r * s * .8, c);
}
function drawWeather(t, dt) {
  const now = performance.now();
  if (weather.thinkSince && now - weather.thinkSince > 8000) weather.target = Math.min(1, weather.target + dt * .08); // 8초 넘게 고민 → 더 흐려짐
  else weather.target = Math.max(0, weather.target - dt * .025); // 천천히 갬
  weather.cloud += (weather.target - weather.cloud) * Math.min(1, dt * 1.5);
  const night = isNight();
  if (weather.cloud > .02) {
    ctx.save(); ctx.globalAlpha = Math.min(.92, weather.cloud);
    CLOUDS.forEach(([cx, cy, sc], i) => {
      const drift = Math.sin(t * .08 + i * 1.7) * 2.2, [x, y] = P(cx + drift, cy, 150 + (i % 3) * 14);
      if (weather.cloud < (i + 1) / (CLOUDS.length + 1)) return; // 흐릴수록 구름이 많아짐
      ctx.globalAlpha = Math.min(.9, weather.cloud * 1.2);
      ellipse(x, y + 120, 46 * sc, 12 * sc, 'rgba(40,40,80,.10)'); // 바닥 그림자
      cloudShape(x, y, sc, night ? '#8d93b8' : now < weather.rainUntil ? '#c9cede' : '#ffffff');
    });
    ctx.restore();
  }
  if (now < weather.rainUntil) { // 비
    ctx.save(); ctx.strokeStyle = night ? 'rgba(170,190,255,.55)' : 'rgba(90,140,220,.55)'; ctx.lineWidth = 1.4; ctx.beginPath();
    CLOUDS.forEach(([cx, cy], i) => {
      const drift = Math.sin(t * .08 + i * 1.7) * 2.2, [x, y] = P(cx + drift, cy, 150 + (i % 3) * 14);
      for (let k = 0; k < 9; k++) { const ox = (k * 13 % 60) - 30, fall = ((t * 260 + k * 37 + i * 50) % 140); ctx.moveTo(x + ox, y + 12 + fall); ctx.lineTo(x + ox - 3, y + 22 + fall); }
    });
    ctx.stroke(); ctx.restore();
  }
  if (now < weather.sunUntil) { // 해 (밤엔 별 반짝임)
    const a = Math.min(1, (weather.sunUntil - now) / 1500, (now - (weather.sunUntil - 7000)) / 600);
    const [x, y] = P(-1, 5, 130);
    ctx.save(); ctx.globalAlpha = a;
    if (night) {
      for (let k = 0; k < 7; k++) { const ang = k * .9 + t, r = 40 + (k % 3) * 22; const [sx, sy] = [x + Math.cos(ang) * r * 2, y + Math.sin(ang) * r]; ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(sx, sy, 2 + Math.sin(t * 6 + k) * 1.2, 0, Math.PI * 2); ctx.fill(); }
    } else {
      const g = ctx.createRadialGradient(x, y, 10, x, y, 120); g.addColorStop(0, 'rgba(255,220,120,.55)'); g.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 120, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffc94d'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
      for (let k = 0; k < 10; k++) { const ang = k / 10 * Math.PI * 2 + t * .5; ctx.moveTo(x + Math.cos(ang) * 34, y + Math.sin(ang) * 34); ctx.lineTo(x + Math.cos(ang) * 46, y + Math.sin(ang) * 46); }
      ctx.stroke(); circle(x, y, 26, '#ffd34d', '#e8a92a');
    }
    ctx.restore();
  }
}

// ───────── 층 꾸미기 ─────────
// 층마다 테마(잔디 · 바닥 빛 · 벽지)와 소품(고양이 · 어항 · 꽃)을 고름. layout.deco[층] 에 저장 (이 브라우저)

    const [x, y] = P(r.x + r.w / 2, r.y + r.h / 2, 30), k = busy.has(id) ? .3 + Math.sin(t * 2 + r.x) * .02 : .14;
    const g = ctx.createRadialGradient(x, y, 4, x, y, 150);
    g.addColorStop(0, `rgba(255,205,130,${k})`); g.addColorStop(1, 'rgba(255,205,130,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 170, 95, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function applyNight() {
  center.classList.toggle('night', isNight());
  const b = $('#nightBtn'); b.textContent = isNight() ? '🌙' : '☀️';
  b.title = nightMode === 'auto' ? '밤 모드: 자동 (저녁 7시~아침 6시) — 누르면 항상 밤' : nightMode === 'night' ? '밤 모드: 항상 밤 — 누르면 항상 낮' : '밤 모드: 항상 낮 — 누르면 자동';
  b.style.outline = nightMode === 'auto' ? '' : '2px solid #ffb347';
}
$('#nightBtn').onclick = () => {
  nightMode = { auto: 'night', night: 'day', day: 'auto' }[nightMode];
  try { localStorage.setItem('office.night', nightMode); } catch { }
  applyNight();
};
applyNight(); setInterval(applyNight, 60e3);
// 가리기 모드 (캡처용) — 이 브라우저에 기억
const setPriv = (v) => { document.body.classList.toggle('priv', v); $('#privBtn').classList.toggle('on', v); $('#privBtn').textContent = v ? '🙈' : '👀'; try { localStorage.setItem('office.priv', v ? '1' : ''); } catch { } };
$('#privBtn').onclick = () => setPriv(!document.body.classList.contains('priv'));
setPriv((() => { try { return !!localStorage.getItem('office.priv'); } catch { return false; } })());
requestAnimationFrame(frame);

const live = $('#live');
function connect() {
  const es = new EventSource('/events');
  es.addEventListener('snap', (m) => { RAW = JSON.parse(m.data); applySnap(); renderUsage(RAW.usage);
    if (RAW.building && RAW.building !== TITLE) { TITLE = RAW.building; if (!alertT) document.title = TITLE; $('#bname').textContent = TITLE; } live.classList.add('ok'); live.querySelector('span').textContent = 'LIVE'; onSnap();
    if (RAW.setup && RAW.setup.need && !setupShown) { setupShown = true; openSetup(true); } });
  es.addEventListener('ev', (m) => onEv(JSON.parse(m.data)));
  es.onerror = () => { live.classList.remove('ok'); live.querySelector('span').textContent = '연결 끊김'; };
}
connect();
</script>
